# Nine nodes: three shard groups of three replicas, with the meta group
# co-hosted on nodes 1 to 3. Any node routes client requests.
services:
  node1:
    build: .
    image: keystone
    command: ["-id", "1", "-peers", "1=node1:7000,2=node2:7000,3=node3:7000,4=node4:7000,5=node5:7000,6=node6:7000,7=node7:7000,8=node8:7000,9=node9:7000", "-groups", "1:1,2,3;2:1,2,3;3:4,5,6;4:7,8,9", "-data", "/data", "-addr", ":7000", "-metrics", ":9100"]
    ports:
      - "7101:7000"
      - "9101:9100"
    volumes:
      - node1:/data
    restart: unless-stopped

  node2:
    build: .
    image: keystone
    command: ["-id", "2", "-peers", "1=node1:7000,2=node2:7000,3=node3:7000,4=node4:7000,5=node5:7000,6=node6:7000,7=node7:7000,8=node8:7000,9=node9:7000", "-groups", "1:1,2,3;2:1,2,3;3:4,5,6;4:7,8,9", "-data", "/data", "-addr", ":7000", "-metrics", ":9100"]
    ports:
      - "7102:7000"
      - "9102:9100"
    volumes:
      - node2:/data
    restart: unless-stopped

  node3:
    build: .
    image: keystone
    command: ["-id", "3", "-peers", "1=node1:7000,2=node2:7000,3=node3:7000,4=node4:7000,5=node5:7000,6=node6:7000,7=node7:7000,8=node8:7000,9=node9:7000", "-groups", "1:1,2,3;2:1,2,3;3:4,5,6;4:7,8,9", "-data", "/data", "-addr", ":7000", "-metrics", ":9100"]
