syntax = "proto3";

package keystone;

option go_package = "github.com/arifisme/keystone/proto;pb";

message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  uint32 type = 3;
  bytes data = 4;
}

message RaftMessage {
  uint32 type = 1;
  uint64 from = 2;
  uint64 to = 3;
  uint64 term = 4;
  uint64 index = 5;
  uint64 log_term = 6;
  repeated LogEntry entries = 7;
  uint64 commit = 8;
  bool reject = 9;
  uint64 conflict_term = 10;
  uint64 conflict_index = 11;
  uint64 read_id = 12;
  bytes data = 13;
  uint64 offset = 14;
  bool done = 15;
}

message StreamAck {}

service Raft {
  rpc Stream(stream RaftMessage) returns (StreamAck);
}
